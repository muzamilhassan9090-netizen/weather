<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>Weatherly — Live Weather</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#14171b;--panel:#1c2228;--panel2:#252d35;--text:#f4f6f8;--muted:#a1aab3;--blue:#b8dff2;--lav:#c8b9ed;--line:#303941;--page:#0d1013;--shadow:0 18px 50px rgba(0,0,0,.16)}
body.light{color-scheme:light;--bg:#f5f7f9;--panel:#ffffff;--panel2:#edf1f4;--text:#17212b;--muted:#4b5966;--blue:#2869a7;--lav:#7762ad;--line:#d5dde5;--page:#e9eef2;--shadow:0 14px 38px rgba(34,53,71,.08)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px 'DM Sans',sans-serif;line-height:1.5;transition:background .25s,color .25s}.app{max-width:1500px;margin:22px auto;min-height:calc(100vh - 44px);background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:26px 30px;overflow:hidden;box-shadow:var(--shadow);transition:background .25s,border-color .25s}button,input{font:inherit}button{cursor:pointer;color:inherit}.top{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}.brand{font:700 21px 'Space Grotesk';letter-spacing:-.6px;display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:#292930;display:grid;place-items:center}.circle{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;transition:transform .18s,background .18s}.circle:hover{transform:translateY(-1px)}button:focus-visible,input:focus-visible,.map-pin:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.loc{white-space:nowrap;color:#ddd}.search{position:relative;flex:1;max-width:440px;margin:auto;display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:0 16px;height:42px}.search input{background:none;border:0;outline:0;color:var(--text);flex:1;min-width:0}.search input::placeholder{color:var(--muted)}.search button{border:0;background:none}.suggest{display:none;position:absolute;top:47px;left:0;right:0;background:var(--panel2);border-radius:14px;overflow:hidden;z-index:5}.suggest.show{display:block}.suggest button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px}.suggest button:hover{background:var(--line)}.actions{display:flex;gap:8px;margin-left:auto}.units{display:flex;padding:4px;background:var(--panel2);border-radius:25px}.units button{border:0;background:transparent;padding:7px 11px;border-radius:20px}.units .active{background:var(--blue);color:#18232b}.tabs{display:flex;gap:25px;margin:20px 0;color:var(--muted)}.tabs button{background:none;border:0;padding:8px 0;color:inherit}.tabs button.active{color:var(--text);font-weight:700;border-bottom:2px solid var(--blue)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px}.head{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px}.head h2{font-size:16px;font-weight:600;margin:0}.switch{display:flex;background:var(--panel2);border-radius:25px;padding:3px;gap:3px}.switch button{border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:20px;font-size:11px}.switch button.active{background:var(--blue);color:#18232b;font-weight:700}.days{display:grid;grid-template-columns:1.5fr repeat(6,minmax(62px,1fr));gap:10px}.day{min-height:165px;background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}.day.today{background:var(--blue);color:#17232c;align-items:stretch;padding:14px}.daytop{display:flex;justify-content:space-between;width:100%;gap:4px;font-size:11px;font-weight:600}.time{white-space:nowrap}.icon{font-size:33px}.today .icon{font-size:43px}.temp{font:600 26px 'Space Grotesk';letter-spacing:-1px}.today .temp{font-size:36px}.desc{font-size:10px;color:var(--muted);text-align:center}.today .desc{color:#56616a;text-align:left}.details-mini{font-size:9px;color:#56616a;line-height:1.65}.err{display:none;padding:12px;background:#3c252a;border:1px solid #69404a;color:#ffdce0;border-radius:12px;margin-top:12px}.err.show{display:block}.sidehead{display:flex;justify-content:space-between;align-items:center;margin:2px 0 18px}.sidehead h2{font-size:14px;margin:0}.muted{font-size:11px;color:var(--muted)}.chart{height:160px;display:flex;justify-content:space-around;align-items:flex-end;position:relative;padding:0 3px 0 35px;border-bottom:1px solid #33333a;margin-bottom:20px}.labels{position:absolute;left:0;top:0;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font-size:10px}.gridlines{position:absolute;left:35px;right:0;top:0;bottom:20px;display:flex;flex-direction:column;justify-content:space-between}.gridlines i{border-top:1px dashed #38383f}.bargrp{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;z-index:1}.bar{width:5px;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:4px}.bargrp small{font-size:9px;color:var(--muted)}.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.city{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 15px;cursor:pointer}.city:hover{background:var(--panel2);transform:translateY(-1px)}.city{transition:background .18s,transform .18s}.cityname{font-size:14px}.citydesc{font-size:11px;color:var(--muted);margin-top:8px}.cityico{font-size:26px;text-align:right}.citytemp{font:600 22px 'Space Grotesk';text-align:right;margin-top:3px}.lower{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;margin-top:32px}.pill{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:20px;font-size:11px;transition:transform .2s,box-shadow .2s,background .2s}.pin{position:absolute;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#101014;border:1px solid #484850;font-size:16px}.day,.circle,.search,.units button,.tabs button,.switch button,.pill,.maptools button,.mapnote button,.city,.bar,.suggest button{transition:all .2s ease}.day:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 25px rgba(35,100,150,.12)}button:hover{filter:brightness(1.08)}.pill:hover,.circle:hover,.maptools button:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(35,100,150,.15)}.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(40,105,167,.12)}.units button:hover,.tabs button:hover,.switch button:hover{color:var(--blue)}.footer{display:flex;justify-content:space-between;gap:12px;padding:24px 3px 0;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:26px}
@media(max-width:1050px){.app{padding:18px}.layout,.lower{grid-template-columns:minmax(0,1fr) 245px;gap:17px}.days{gap:7px}.day{padding:10px 7px}.temp{font-size:22px}.today .temp{font-size:30px}}
@media(max-width:780px){.app{margin:0;min-height:100vh;padding:16px;border-radius:0;border-left:0;border-right:0}.top{gap:10px}.brand{margin-right:auto}.loc{order:3;width:100%}.search{order:4;flex-basis:100%;max-width:none}.actions{margin-left:0}.layout,.lower{grid-template-columns:1fr;gap:23px}.days{grid-template-columns:repeat(7,minmax(82px,1fr));overflow-x:auto;padding-bottom:6px}.day{min-width:82px;min-height:150px}.day.today{min-width:140px}.cities{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.city{padding:10px;align-items:flex-start}.cityname{font-size:12px}.citytemp{font-size:18px}.chart{height:135px}.map{height:255px}.tabs{gap:18px}}
@media(max-width:480px){.cities{grid-template-columns:1fr}.city{align-items:center}.cityright{display:flex;align-items:center;gap:8px}.citytemp{margin:0}.mapnote{width:145px;padding:11px;left:10px;bottom:10px}.footer{flex-direction:column}.head h2{font-size:14px}.switch button{padding:7px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><span class="logo">☷</span> weatherly</div><button class="circle" id="refresh" aria-label="Refresh weather">↻</button><div class="loc">● <span id="loc">Lahore, Pakistan</span></div><div class="search"><span>⌕</span><input id="q" placeholder="Search city..." aria-label="Search city" autocomplete="off"><button id="go" aria-label="Search">↵</button><div class="suggest" id="suggest"></div></div><div class="actions"><div class="units"><button id="c" class="active" aria-label="Celsius">°C</button><button id="f" aria-label="Fahrenheit">°F</button></div><button class="circle" id="themeToggle" aria-label="Switch to light mode" title="Switch theme">☾</button></div></header>
<nav class="tabs"><button data-days="1">Today</button><button data-days="2">Tomorrow</button><button data-days="7" class="active">Next 7 days</button></nav>
<div class="layout"><main><div class="head"><h2 id="forecastTitle">7-day forecast</h2><div class="switch"><button id="forecast" class="active">Forecast</button><button id="air">Humidity</button></div></div><div class="days" id="days"></div><div class="err" id="err" role="alert"></div></main>
<aside><div class="sidehead"><h2 id="chartTitle">Chance of rain</h2><span class="muted">Next 12 hours</span></div><div class="chart" id="chart"><div class="labels"><span>100%</span><span>50%</span><span>0%</span></div><div class="gridlines"><i></i><i></i><i></i></div></div></aside></div>
<div class="lower"><section><div class="head"><h2>Other large cities</h2><button class="pill" id="show">Show all ›</button></div><div class="cities" id="cities"></div><div class="head" style="margin-top:22px"><h2>Weather details</h2><span class="muted" id="detailCity">Lahore</span></div><div class="cities" id="details"></div></section></div><footer class="footer"><span>Weatherly · Live weather dashboard</span><span>Live data by Open-Meteo · No API key required</span></footer></div>
<script>
const $=id=>document.getElementById(id),S={city:null,data:null,unit:'C',days:7,humidity:false,all:false};
const W={0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm','⛈️'],99:['Severe thunderstorm','⛈️']};
const wx=c=>W[c]||['Variable conditions','🌤️'],T=n=>n==null?'—':Math.round(S.unit==='C'?n:n*9/5+32)+'°',txt=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function geocode(q){let r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=en&format=json');if(!r.ok)throw Error('City search is unavailable right now.');let j=await r.json();if(!j.results?.length)throw Error('City not found. Check the spelling and try again.');return j.results}
async function load(p){$('err').classList.remove('show');$('days').style.opacity='.55';try{let u=new URL('https://api.open-meteo.com/v1/forecast');u.search=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m',hourly:'temperature_2m,precipitation_probability,weather_code,relative_humidity_2m',daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max',timezone:'auto',forecast_days:'7'});let r=await fetch(u);if(!r.ok)throw Error('Could not load live weather. Please refresh and try again.');let d=await r.json();if(!d.current||!d.daily)throw Error('Weather data was incomplete. Try again.');S.city=p;S.data=d;$('loc').textContent=[p.name,p.admin1,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', ');$('detailCity').textContent=p.name;render();}catch(e){$('err').textContent=e.message||'Something went wrong.';$('err').classList.add('show')}finally{$('days').style.opacity='1'}}
function render(){renderDays();renderChart();renderDetails();renderCities()}
function renderDays(){let d=S.data.daily,c=S.data.current,n=Math.min(S.days,d.time.length);$('forecastTitle').textContent=S.days===1?'Today’s forecast':S.days===2?'Tomorrow’s forecast':'7-day forecast';$('days').innerHTML=Array.from({length:n},(_,i)=>{let w=wx(d.weather_code[i]),today=i===0,day=today?'Today':new Date(d.time[i]+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'});if(today)return `<article class="day today"><div class="daytop"><span>${new Date(d.time[i]+'T12:00:00').toLocaleDateString(undefined,{weekday:'long'})}</span><span class="time">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:5px"><div><div class="temp">${T(c.temperature_2m)}</div><div class="desc">${w[0]}</div></div><div class="icon">${w[1]}</div></div><div class="details-mini">Feels like ${T(c.apparent_temperature)}<br>Wind: ${Math.round(c.wind_speed_10m)} km/h<br>Humidity: ${c.relative_humidity_2m}%<br>Sunrise: ${d.sunrise[i].slice(11,16)} · Sunset: ${d.sunset[i].slice(11,16)}</div></article>`;return `<article class="day"><div class="daytop"><span>${day}</span></div><div class="icon">${w[1]}</div><div class="temp">${T(d.temperature_2m_max[i])}</div><div class="desc">${T(d.temperature_2m_min[i])} low</div><div class="desc">${w[0]}</div></article>`}).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',+b.dataset.days===S.days))}
function renderChart(){let h=S.data.hourly,now=S.data.current.time,start=h.time.findIndex(t=>t>=now);if(start<0)start=0;let ix=Array.from({length:6},(_,i)=>Math.min(start+i*2,h.time.length-1)),v=ix.map(i=>S.humidity?h.relative_humidity_2m[i]:h.precipitation_probability[i]);$('chartTitle').textContent=S.humidity?'Humidity forecast':'Chance of rain';$('chart').innerHTML=`<div class="labels"><span>100%</span><span>50%</span><span>0%</span></div><div class="gridlines"><i></i><i></i><i></i></div>`+ix.map((i,j)=>`<div class="bargrp"><div class="bar" title="${v[j]}%" style="height:${Math.max(4,v[j]||0)}%"></div><small>${h.time[i].slice(11,16)}</small></div>`).join('');$('forecast').classList.toggle('active',!S.humidity);$('air').classList.toggle('active',S.humidity)}
function renderDetails(){let c=S.data.current,d=S.data.daily,rows=[['Feels like',T(c.apparent_temperature),'🌡️'],['Humidity',c.relative_humidity_2m+'%','💧'],['Wind speed',Math.round(c.wind_speed_10m)+' km/h','🌬️'],['Precipitation',(c.precipitation??0)+' mm','🌧️'],['UV index',d.uv_index_max[0],'☀️'],['Sunrise / Sunset',d.sunrise[0].slice(11,16)+' / '+d.sunset[0].slice(11,16),'🌅']];$('details').innerHTML=rows.map(r=>`<div class="city" style="cursor:default"><div><div class="muted">${r[0]}</div><div class="cityname" style="margin-top:4px">${r[1]}</div></div><div class="cityico">${r[2]}</div></div>`).join('')}
const places=[{name:'Karachi',country:'Pakistan',latitude:24.8607,longitude:67.0011,admin1:'Sindh'},{name:'Islamabad',country:'Pakistan',latitude:33.6844,longitude:73.0479,admin1:'Islamabad'},{name:'London',country:'United Kingdom',latitude:51.5072,longitude:-.1276,admin1:'England'},{name:'Dubai',country:'United Arab Emirates',latitude:25.2048,longitude:55.2708},{name:'Tokyo',country:'Japan',latitude:35.6762,longitude:139.6503},{name:'New York',country:'United States',latitude:40.7128,longitude:-74.006}];
async function cityWx(p){try{let u=new URL('https://api.open-meteo.com/v1/forecast');u.search=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,current:'temperature_2m,weather_code',timezone:'auto'});let r=await fetch(u);let j=await r.json();return {p,t:j.current.temperature_2m,code:j.current.weather_code}}catch{return {p,t:null,code:2}}}
async function renderCities(){let ps=S.all?places:places.slice(0,3);$('cities').innerHTML=ps.map(p=>{let k=p.name.replace(/\W/g,'');return `<div class="city" data-name="${p.name}"><div><div class="muted">${p.country}</div><div class="cityname">${p.name}</div><div class="citydesc" id="desc${k}">Loading…</div></div><div><div class="cityico" id="ico${k}">🌤️</div><div class="citytemp" id="temp${k}">—</div></div></div>`}).join('');$('cities').querySelectorAll('.city').forEach(el=>el.onclick=()=>search(el.dataset.name));for(let p of ps){let x=await cityWx(p),k=p.name.replace(/\W/g,'');if($('temp'+k)){$('temp'+k).textContent=T(x.t);$('ico'+k).textContent=wx(x.code)[1];$('desc'+k).textContent=wx(x.code)[0]}}}
async function search(q=$('q').value){q=q.trim();if(!q)return; $('suggest').classList.remove('show');try{let ps=await geocode(q);await load(ps[0]);$('q').value=''}catch(e){$('err').textContent=e.message;$('err').classList.add('show')}}
let timer; $('q').addEventListener('input',()=>{clearTimeout(timer);let q=$('q').value.trim();if(q.length<2){$('suggest').classList.remove('show');return}timer=setTimeout(async()=>{try{let ps=await geocode(q);$('suggest').innerHTML=ps.map((p,i)=>`<button data-i="${i}">${txt(p.name)}${p.admin1?', '+txt(p.admin1):''}${p.country?', '+txt(p.country):''}</button>`).join('');$('suggest').classList.add('show');$('suggest').querySelectorAll('button').forEach(b=>b.onclick=()=>{load(ps[+b.dataset.i]);$('q').value='';$('suggest').classList.remove('show')})}catch{$('suggest').classList.remove('show')}},300)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();if(e.key==='Escape')$('suggest').classList.remove('show')});
const themeToggle=$('themeToggle');function setTheme(light){document.body.classList.toggle('light',light);themeToggle.textContent=light?'☀':'☾';themeToggle.setAttribute('aria-label',light?'Switch to dark mode':'Switch to light mode');themeToggle.title=light?'Switch to dark mode':'Switch to light mode';try{localStorage.setItem('weatherly-theme',light?'light':'dark')}catch(e){}}try{setTheme(localStorage.getItem('weatherly-theme')==='light')}catch(e){setTheme(false)}themeToggle.onclick=()=>setTheme(!document.body.classList.contains('light'));$('go').onclick=()=>search();$('refresh').onclick=()=>S.city&&load(S.city);$('c').onclick=()=>{S.unit='C';$('c').classList.add('active');$('f').classList.remove('active');if(S.data)render()};$('f').onclick=()=>{S.unit='F';$('f').classList.add('active');$('c').classList.remove('active');if(S.data)render()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.days=+b.dataset.days;renderDays()});$('forecast').onclick=()=>{S.humidity=false;renderChart()};$('air').onclick=()=>{S.humidity=true;renderChart()};$('show').onclick=()=>{S.all=!S.all;$('show').textContent=S.all?'Show less ‹':'Show all ›';renderCities()};document.addEventListener('click',e=>{if(!$('suggest').contains(e.target)&&e.target!==$('q'))$('suggest').classList.remove('show')});
async function init(){initWorldMap();try{let ps=await geocode('Lahore');await load(ps.find(p=>p.country==='Pakistan')||ps[0])}catch{await load({name:'Lahore',country:'Pakistan',admin1:'Punjab',latitude:31.5204,longitude:74.3587})}}init();setInterval(()=>S.city&&load(S.city),15*60*1000);
</script></body></html>
